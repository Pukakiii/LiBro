<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiBro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>LiBro</h1>
      <div id="logo-container">
        <img
          id="logo"
          src="simple-books-catalogue/assets/book.svg"
          alt="Book Logo"
        />
      </div>
      <h2>Your library</h2>
    </header>
    <main>
      <form id="search-form">
        <input
          id="input"
          required
          type="text"
          placeholder="Search for a book title..."
          name="book"
        />
        <button type="submit" id="searchBtn">Search</button>
      </form>
      <div class="content">
        <section id="results-section">
          <h2>Search Results</h2>
          <div id="book-list">
            <p class="empty-state">
              Enter a book title and click search to begin
            </p>
          </div>
        </section>

        <aside class="favorites-section">
          <h2>Favorites</h2>
          <div id="favorites">
            <p class="empty-state">
              No favorites yet. Add books to your collection!
            </p>
          </div>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
